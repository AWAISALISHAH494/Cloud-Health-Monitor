services:

  db:
      image: postgres:15
      container_name: cloud-service-monitor-db
      environment:
        POSTGRES_DB: cloud_monitor
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      volumes:
        - postgres_data:/var/lib/postgresql/data
      restart: unless-stopped

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_monitor"]
        interval: 5s
        timeout: 5s
        retries: 10
  web:
    image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/cloud-service-monitor:latest
    container_name: cloud-service-monitor
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: cloud_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: