apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-service-monitor-deployment
  labels:
    app: cloud-service-monitor 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-service-monitor
  template:
    metadata:
      name: cloud-service-monitor
      labels:
        app: cloud-service-monitor
    spec:
      imagePullSecrets:
          - name: ecr-secret
      containers:
        - name: cloud-service-monitor
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/cloud-service-monitor:latest
          ports:
            - containerPort: 8000
