
name: Cloud Service Monitor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:


  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test monitoring


  # ============================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-service-monitor:latest

          echo "Building Docker image..."
          docker build -t ${IMAGE_NAME} .

          echo "Pushing Docker image to ECR..."
          docker push ${IMAGE_NAME}


  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yaml"
          target: "/home/ubuntu/cloud-service-monitor/"

      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/cloud-service-monitor

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} | \
            docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            echo "Pulling latest Docker image..."

            docker compose pull

            echo "Starting application..."

            docker compose up -d

            echo "Running database migrations..."

            docker compose exec -T web python manage.py migrate

            echo "Deployment completed successfully."


  health-check:
    name: Verify Deployment Health
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for application startup
        run: |
          echo "Waiting for Django application to start..."
          sleep 10

      - name: Invoke Lambda Health Check
        run: |
          echo "Invoking Lambda health check..."

          aws lambda invoke \
            --function-name django-health-check \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            lambda-response.json

          echo "Lambda response:"
          cat lambda-response.json

      - name: Verify deployment health
        run: |
          STATUS=$(jq -r '.statusCode' lambda-response.json)

          echo "Health check status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Deployment health check failed"
            exit 1
          fi

          echo "✅ Deployment health check passed"
